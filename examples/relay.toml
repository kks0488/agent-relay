[relay]
max_concurrent = 4
wait_timeout = 60
timeout = 300
lock_timeout = 10
review_language = "en"
state_dir = "~/.local/state/agent-relay"

[modes]
research = ["codex", "claude"]
code = ["codex", "claude"]
review = ["codex", "claude"]
cross = ["codex", "claude"]
write = ["claude", "codex"]

[engines.codex]
command = ["codex", "exec", "--skip-git-repo-check", "--output-last-message", "{output}", "-"]
output = "file"

[engines.claude]
command = ["claude", "-p", "--output-format", "text"]

# Optional engines: add their names to the mode orders above to enable them.
[engines.gemini]
command = ["gemini", "-p", "{prompt}"]

# Replace the endpoint, model, environment variable name and prices before use.
# A zero daily budget disables this API engine.
[engines.api]
type = "api"
base_url = "https://api.example.com/v1"
model = "your-model"
api_key_env = "YOUR_API_KEY"
daily_budget_usd = 0
input_usd_per_million = 0
output_usd_per_million = 0
